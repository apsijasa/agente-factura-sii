# Ciclo nube 1/2: prepara las facturas del día desde el Excel de OneDrive y
# envía las solicitudes de aprobación remota (WhatsApp o correo).
# No toca el SII ni emite nada: la emisión vive en emit-approved.yml y solo
# ocurre después de la aprobación humana.
name: Preparar y notificar

on:
  schedule:
    - cron: '0 11 * * *' # 07:00 Chile (invierno) todos los días
  workflow_dispatch:
    inputs:
      fecha:
        description: >-
          Ponerse al día con un lote atrasado: fecha programada AAAA-MM-DD
          (ej. 2026-09-25). Vacío = hoy, que es lo que hace el cron diario.
        required: false
        type: string

concurrency:
  group: facturacion-sii
  cancel-in-progress: false

jobs:
  prepare-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTE_CONFIG_JSON: ${{ secrets.AGENTE_CONFIG_JSON }}
      CF_API_URL: ${{ secrets.CF_API_URL }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
      APPROVAL_URL: ${{ secrets.APPROVAL_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
    steps:
      - name: Verificar configuración
        run: |
          if { [ -z "$CF_API_URL" ] && [ -n "$CF_API_TOKEN" ]; } || { [ -n "$CF_API_URL" ] && [ -z "$CF_API_TOKEN" ]; }; then
            echo "::error::Credenciales de Cloudflare incompletas: falta CF_API_URL o CF_API_TOKEN; con media credencial el agente no opera"
            exit 1
          fi
          if [ -z "$AGENTE_CONFIG_JSON" ] || [ -z "$CF_API_URL" ]; then
            echo "::notice::Secretos aún no configurados (ver docs/cloudflare.md); nada que hacer."
            echo "CONFIGURADO=no" >> "$GITHUB_ENV"
          else
            echo "CONFIGURADO=si" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.CONFIGURADO == 'si'
      - uses: pnpm/action-setup@v4
        if: env.CONFIGURADO == 'si'
      - uses: actions/setup-node@v4
        if: env.CONFIGURADO == 'si'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CONFIGURADO == 'si'
      # `prepare` solo crea facturas cuando la fecha pedida calza EXACTO con la
      # programada, así que un lote que no se preparó el día que tocaba no se
      # recupera solo: el cron de mañana lo deja en `atrasados`. La fecha
      # explícita es la única forma de ponerse al día.
      #
      # La fecha viaja por entorno y no interpolada en el `run`: este job tiene
      # las claves del SII, y un input incrustado en la shell es inyección de
      # comandos. Se valida el formato antes de pasarla al agente.
      - name: Preparar facturas del día
        if: env.CONFIGURADO == 'si'
        env:
          FECHA: ${{ inputs.fecha }}
        run: |
          if [ -z "$FECHA" ]; then
            pnpm agent prepare --mode simulation
          elif printf '%s' "$FECHA" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Poniéndose al día con el lote programado para $FECHA"
            pnpm agent prepare --mode simulation --date "$FECHA"
          else
            echo "::error::fecha inválida: se espera AAAA-MM-DD"
            exit 1
          fi
      - name: Enviar solicitudes de aprobación
        if: env.CONFIGURADO == 'si'
        run: pnpm agent notify
