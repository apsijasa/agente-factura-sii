# Ciclo nube 2/2: emite en el SII únicamente las facturas ya aprobadas por el
# operador (aprobación remota ligada al hash exacto del contenido).
# El primer paso es un chequeo barato contra el Worker de Cloudflare (D1): si no hay nada aprobado
# pendiente, el run termina en segundos sin instalar nada.
name: Emitir aprobadas

on:
  schedule:
    - cron: '*/30 12-23 * * *' # cada 30 min, 08:00–19:30 Chile (invierno)
  workflow_dispatch:

concurrency:
  group: facturacion-sii
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      hay_trabajo: ${{ steps.chequeo.outputs.hay_trabajo }}
    steps:
      - name: ¿Hay facturas aprobadas pendientes de emitir?
        id: chequeo
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_URL" ]; then
            echo "::notice::Secretos aún no configurados (ver docs/cloudflare.md); nada que hacer."
            echo "hay_trabajo=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pendientes=$(curl -sf "$CF_API_URL/api/gate/aprobadas-pendientes" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          echo "Aprobadas pendientes: $pendientes"
          if [ "$pendientes" = "[]" ]; then
            echo "hay_trabajo=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay_trabajo=si" >> "$GITHUB_OUTPUT"
          fi

  emitir:
    needs: gate
    if: needs.gate.outputs.hay_trabajo == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTE_CONFIG_JSON: ${{ secrets.AGENTE_CONFIG_JSON }}
      CF_API_URL: ${{ secrets.CF_API_URL }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      SII_CLAVE: ${{ secrets.SII_CLAVE }}
      SII_CLAVE_FIRMA: ${{ secrets.SII_CLAVE_FIRMA }}
      SII_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Emitir facturas aprobadas
        run: pnpm agent emit-approved
      - name: Guardar evidencia de la sesión SII
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-sii-${{ github.run_id }}
          path: .data/evidence/
          if-no-files-found: ignore
          retention-days: 30
